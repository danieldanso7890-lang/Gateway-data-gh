<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#0b1023"/>
<title>Gateway Data GH</title>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<!-- PAYSTACK - Load first -->
<script src="https://js.paystack.co/v1/inline.js"></script>

<!-- FIREBASE COMPAT SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#050816;color:white;overflow-x:hidden;}

/* NAV */
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 6%;background:#0b1023;position:sticky;top:0;z-index:1000;border-bottom:1px solid rgba(255,255,255,0.08);}
.logo{font-size:24px;font-weight:700;color:#ffd700;cursor:pointer;}
.logo span{color:#4da3ff;}
nav ul{display:flex;gap:24px;list-style:none;}
nav ul li a{text-decoration:none;color:#ccc;font-weight:500;font-size:14px;transition:0.3s;cursor:pointer;}
nav ul li a:hover{color:#ffd700;}
.nav-right{display:flex;align-items:center;gap:10px;}
.btn{background:linear-gradient(45deg,#ffd700,#4da3ff);padding:10px 20px;border:none;border-radius:30px;font-weight:600;cursor:pointer;color:black;transition:0.3s;font-size:13px;font-family:'Poppins',sans-serif;}
.btn:hover{transform:scale(1.05);}
.btn-outline{background:transparent;border:1px solid rgba(255,255,255,0.2);color:white;padding:10px 20px;border-radius:30px;font-weight:500;cursor:pointer;font-size:13px;font-family:'Poppins',sans-serif;transition:0.3s;}
.btn-outline:hover{border-color:#ffd700;color:#ffd700;}
.notif-bell{position:relative;cursor:pointer;font-size:19px;color:#aaa;transition:0.3s;}
.notif-bell:hover{color:#ffd700;}
.notif-dot{position:absolute;top:-3px;right:-3px;width:8px;height:8px;background:#e63946;border-radius:50%;border:2px solid #0b1023;display:none;}
.nav-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ffd700,#4da3ff);display:none;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#000;cursor:pointer;}
.nav-avatar.show{display:flex;}

/* LOADING */
.loading-screen{position:fixed;inset:0;background:#050816;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity 0.5s;}
.loading-screen.hide{opacity:0;pointer-events:none;}
.loading-logo{font-size:26px;font-weight:700;color:#ffd700;}
.loading-logo span{color:#4da3ff;}
.loading-spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,0.08);border-top-color:#ffd700;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:12px;color:#444;}

/* PAGES */
.page{display:none;}
.page.active{display:block;}

/* AUTH */
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 5%;background:linear-gradient(135deg,#050816,#0b1023,#050816);}
.auth-box{width:100%;max-width:420px;background:#0d132b;border:1px solid rgba(255,255,255,0.08);border-radius:26px;padding:36px 32px;position:relative;overflow:hidden;}
.auth-box::before{content:'';position:absolute;top:-80px;right:-80px;width:200px;height:200px;background:radial-gradient(circle,rgba(77,163,255,0.08),transparent 70%);border-radius:50%;}
.auth-logo{text-align:center;font-size:22px;font-weight:700;color:#ffd700;margin-bottom:5px;}
.auth-logo span{color:#4da3ff;}
.auth-sub{text-align:center;color:#555;font-size:13px;margin-bottom:24px;}
.auth-tabs{display:flex;background:#060d20;border-radius:13px;padding:4px;margin-bottom:22px;}
.auth-tab{flex:1;padding:10px;border:none;border-radius:10px;background:transparent;color:#555;font-size:13px;font-weight:600;cursor:pointer;transition:0.3s;font-family:'Poppins',sans-serif;}
.auth-tab.active{background:linear-gradient(45deg,#ffd700,#4da3ff);color:#000;}
.auth-form{display:none;}
.auth-form.show{display:block;}
.auth-field{margin-bottom:14px;}
.auth-field label{display:block;font-size:11px;color:#666;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px;}
.auth-field-wrap{position:relative;}
.auth-field-wrap .fi{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#2a2a2a;font-size:13px;}
.auth-field input{width:100%;background:#060d20;border:1px solid rgba(255,255,255,0.07);border-radius:11px;padding:11px 38px;color:white;font-size:14px;font-family:'Poppins',sans-serif;outline:none;transition:0.3s;}
.auth-field input:focus{border-color:#4da3ff;box-shadow:0 0 0 3px rgba(77,163,255,0.08);}
.auth-field input::placeholder{color:#222;}
.eye-btn{position:absolute;right:13px;top:50%;transform:translateY(-50%);cursor:pointer;color:#2a2a2a;font-size:13px;background:none;border:none;transition:0.2s;}
.eye-btn:hover{color:#aaa;}
.strength-bar{height:3px;border-radius:3px;margin-top:5px;background:#0d0d0d;overflow:hidden;}
.strength-fill{height:100%;width:0%;border-radius:3px;transition:0.4s;}
.strength-lbl{font-size:10px;color:#333;margin-top:3px;}
.auth-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:12px;}
.auth-check{display:flex;align-items:center;gap:7px;color:#555;cursor:pointer;}
.auth-check input{accent-color:#4da3ff;cursor:pointer;}
.auth-link{color:#4da3ff;cursor:pointer;background:none;border:none;font-size:12px;font-family:'Poppins',sans-serif;}
.auth-link:hover{text-decoration:underline;}
.auth-submit{width:100%;padding:13px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;background:linear-gradient(45deg,#ffd700,#4da3ff);color:#000;font-family:'Poppins',sans-serif;transition:0.3s;margin-bottom:16px;}
.auth-submit:hover{transform:scale(1.02);}
.auth-submit:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.auth-divider{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.auth-divider span{flex:1;height:1px;background:rgba(255,255,255,0.04);}
.auth-divider p{font-size:11px;color:#2a2a2a;}
.social-btns{display:flex;gap:9px;margin-bottom:16px;}
.social-btn{flex:1;padding:10px;border:1px solid rgba(255,255,255,0.06);border-radius:11px;background:transparent;color:#666;font-size:12px;font-weight:500;cursor:pointer;transition:0.3s;font-family:'Poppins',sans-serif;display:flex;align-items:center;justify-content:center;gap:7px;}
.social-btn:hover{border-color:rgba(255,255,255,0.16);color:white;}
.auth-footer{text-align:center;font-size:12px;color:#333;margin-top:14px;}
.auth-error{background:rgba(230,57,70,0.08);border:1px solid rgba(230,57,70,0.25);border-radius:10px;padding:10px 14px;font-size:12px;color:#e63946;margin-bottom:12px;display:none;line-height:1.5;}
.auth-error.show{display:block;}

/* HERO */
.hero{min-height:90vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 8%;background:linear-gradient(rgba(5,8,22,0.87),rgba(5,8,22,0.9)),url('https://images.unsplash.com/photo-1520607162513-77705c0f0d4a?q=80&w=2070&auto=format&fit=crop');background-size:cover;background-position:center;}
.hero-content h1{font-size:56px;line-height:1.2;margin-bottom:18px;}
.hero-content h1 span{color:#ffd700;}
.hero-content p{font-size:16px;color:#ccc;margin-bottom:26px;}
.hero-buttons{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;}

/* SERVICES */
.services{padding:70px 8%;}
.section-title{text-align:center;font-size:34px;margin-bottom:40px;color:#ffd700;}
.service-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;}
.scard{background:#0d132b;padding:30px;border-radius:18px;text-align:center;transition:0.3s;border:1px solid rgba(255,255,255,0.05);cursor:pointer;}
.scard:hover{transform:translateY(-8px);border-color:#ffd700;}
.scard i{font-size:42px;margin-bottom:16px;color:#4da3ff;}
.scard h3{margin-bottom:7px;font-size:19px;}
.scard p{color:#aaa;font-size:13px;}

/* PRICING */
.pricing{padding:70px 8%;background:#0a0f20;}
.price-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;}
.price-card{background:#101935;padding:26px;border-radius:18px;text-align:center;border:1px solid rgba(255,255,255,0.05);transition:0.3s;}
.price-card:hover{transform:scale(1.03);border-color:#4da3ff;}
.price-card h2{font-size:30px;color:#ffd700;margin:10px 0;}

/* FOOTER */
footer{padding:26px 8%;text-align:center;background:#050816;border-top:1px solid rgba(255,255,255,0.05);}
footer p{color:#333;font-size:12px;}

/* DATA PAGE */
.data-page,.airtime-page{min-height:100vh;padding:46px 5%;}
.page-title{text-align:center;font-size:32px;font-weight:700;color:#ffd700;margin-bottom:7px;}
.page-sub{text-align:center;color:#555;margin-bottom:32px;font-size:13px;}
.network-buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:800px;margin:0 auto 42px auto;}
.net-btn{padding:26px 16px;border:none;border-radius:18px;font-size:18px;font-weight:700;cursor:pointer;transition:all 0.3s;display:flex;flex-direction:column;align-items:center;gap:9px;font-family:'Poppins',sans-serif;}
.net-btn i{font-size:34px;}
.net-btn:hover{transform:translateY(-5px);box-shadow:0 14px 36px rgba(0,0,0,0.4);}
.net-btn.mtn{background:linear-gradient(135deg,#ffcc00,#ff9900);color:#000;}
.net-btn.tele{background:linear-gradient(135deg,#e63946,#c1121f);color:#fff;}
.net-btn.airteltigo{background:linear-gradient(135deg,#2dc653,#007f5f);color:#fff;}
.net-btn.combo{background:linear-gradient(135deg,#4da3ff,#7b2ff7);color:#fff;}
.plans-section{max-width:800px;margin:0 auto;display:none;}
.plans-section.show{display:block;}
.plans-header{display:flex;align-items:center;gap:13px;margin-bottom:24px;}
.back-btn{background:rgba(255,255,255,0.07);border:none;color:white;padding:8px 15px;border-radius:30px;cursor:pointer;font-size:13px;transition:0.3s;font-family:'Poppins',sans-serif;}
.back-btn:hover{background:rgba(255,255,255,0.13);}
.plans-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;}
.plan-card{border-radius:14px;padding:17px 12px;text-align:center;cursor:pointer;transition:all 0.25s;border:2px solid transparent;}
.plan-card:hover{transform:translateY(-4px);}
.plan-card.mtn-card{background:#1a1500;border-color:#ffcc0028;}.plan-card.mtn-card:hover{border-color:#ffcc00;}.plan-card.mtn-card .plan-gb,.plan-card.mtn-card .plan-price{color:#ffcc00;}
.plan-card.tele-card{background:#1a0507;border-color:#e6394628;}.plan-card.tele-card:hover{border-color:#e63946;}.plan-card.tele-card .plan-gb,.plan-card.tele-card .plan-price{color:#e63946;}
.plan-card.at-card{background:#001a09;border-color:#2dc65328;}.plan-card.at-card:hover{border-color:#2dc653;}.plan-card.at-card .plan-gb,.plan-card.at-card .plan-price{color:#2dc653;}
.plan-card.combo-card{background:#090d1a;border-color:#4da3ff28;}.plan-card.combo-card:hover{border-color:#4da3ff;}.plan-card.combo-card .plan-gb,.plan-card.combo-card .plan-price{color:#4da3ff;}
.plan-gb{font-size:22px;font-weight:700;color:white;margin-bottom:3px;}
.plan-price{font-size:17px;font-weight:700;margin-bottom:4px;}
.plan-label{font-size:10px;color:#333;}
.plan-buy-btn{margin-top:10px;padding:7px 12px;border:none;border-radius:30px;font-size:11px;font-weight:600;cursor:pointer;width:100%;transition:0.3s;font-family:'Poppins',sans-serif;}
.plan-card.mtn-card .plan-buy-btn{background:#ffcc00;color:#000;}
.plan-card.tele-card .plan-buy-btn{background:#e63946;color:#fff;}
.plan-card.at-card .plan-buy-btn{background:#2dc653;color:#000;}
.plan-card.combo-card .plan-buy-btn{background:#4da3ff;color:#000;}
.plan-buy-btn:hover{opacity:0.85;}
.combo-selector{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px;}
.combo-tab{padding:6px 14px;border-radius:30px;border:2px solid rgba(77,163,255,0.3);background:transparent;color:white;cursor:pointer;font-size:12px;font-weight:600;transition:0.3s;font-family:'Poppins',sans-serif;}
.combo-tab.active,.combo-tab:hover{background:#4da3ff;border-color:#4da3ff;color:#000;}

/* AIRTIME */
.airtime-network-btns{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:800px;margin:0 auto 36px auto;}
.at-net-btn{padding:30px 18px;border:none;border-radius:20px;font-size:19px;font-weight:700;cursor:pointer;transition:all 0.3s;display:flex;flex-direction:column;align-items:center;gap:11px;font-family:'Poppins',sans-serif;}
.at-net-btn i{font-size:38px;}
.at-net-btn .net-tag{font-size:10px;opacity:0.7;font-weight:500;}
.at-net-btn:hover{transform:translateY(-5px);box-shadow:0 16px 40px rgba(0,0,0,0.4);}
.at-net-btn.mtn{background:linear-gradient(135deg,#ffcc00,#ff8800);color:#000;}
.at-net-btn.tele{background:linear-gradient(135deg,#e63946,#9b0a14);color:#fff;}
.at-net-btn.at{background:linear-gradient(135deg,#2dc653,#005e3a);color:#fff;}
.airtime-form-card{max-width:480px;margin:0 auto;background:#0d132b;border-radius:22px;border:1px solid rgba(255,255,255,0.06);overflow:hidden;display:none;}
.airtime-form-card.show{display:block;}
.afc-header{padding:20px 24px 0;}
.afc-body{padding:20px 24px 24px;}
.afc-field{margin-bottom:15px;}
.afc-field label{display:block;font-size:11px;color:#666;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px;}
.afc-field input,.afc-field select{width:100%;background:#060d20;border:1px solid rgba(255,255,255,0.07);border-radius:11px;padding:11px 14px;color:white;font-size:13px;font-family:'Poppins',sans-serif;outline:none;transition:0.3s;}
.afc-field input:focus,.afc-field select:focus{border-color:#4da3ff;}
.afc-field input::placeholder{color:#222;}
.afc-field select option{background:#0d132b;}
.afc-quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;}
.afc-qa{padding:5px 12px;border:1px solid rgba(255,215,0,0.25);border-radius:20px;background:transparent;color:#ffd700;cursor:pointer;font-size:11px;font-weight:600;transition:0.3s;font-family:'Poppins',sans-serif;}
.afc-qa:hover{background:#ffd700;color:#000;}
.afc-total{background:#060d20;border-radius:12px;padding:13px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.afc-total span{color:#555;font-size:12px;}
.afc-total strong{color:#ffd700;font-size:17px;font-weight:700;}
.afc-submit{width:100%;padding:13px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:0.3s;font-family:'Poppins',sans-serif;}
.afc-submit.mtn{background:linear-gradient(45deg,#ffcc00,#ff8800);color:#000;}
.afc-submit.tele{background:linear-gradient(45deg,#e63946,#9b0a14);color:#fff;}
.afc-submit.at{background:linear-gradient(45deg,#2dc653,#005e3a);color:#fff;}
.afc-submit:hover{transform:scale(1.02);}

/* WALLET */
.wallet-page{min-height:100vh;padding:36px 5% 70px;}
.wallet-balance-card{background:linear-gradient(135deg,#0f2044,#1a0a35);border:1px solid rgba(77,163,255,0.15);border-radius:24px;padding:30px;max-width:640px;margin:0 auto 22px;position:relative;overflow:hidden;}
.wallet-balance-card::before{content:'';position:absolute;top:-60px;right:-60px;width:180px;height:180px;background:radial-gradient(circle,rgba(77,163,255,0.09),transparent 70%);border-radius:50%;}
.wallet-label{font-size:11px;color:#888;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;}
.wallet-amount{font-size:46px;font-weight:700;color:#ffd700;margin-bottom:3px;letter-spacing:-1px;}
.wallet-amount span{font-size:19px;font-weight:500;color:#888;}
.wallet-user{font-size:12px;color:#444;margin-bottom:22px;}
.wallet-actions{display:flex;gap:9px;flex-wrap:wrap;}
.wal-action-btn{flex:1;min-width:80px;padding:12px 6px;border:none;border-radius:14px;font-size:11px;font-weight:600;cursor:pointer;transition:0.3s;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:'Poppins',sans-serif;}
.wal-action-btn i{font-size:17px;}
.wal-action-btn:hover{transform:translateY(-3px);filter:brightness(1.1);}
.wal-btn-fund{background:linear-gradient(135deg,#ffd700,#ff9900);color:#000;}
.wal-btn-transfer{background:linear-gradient(135deg,#4da3ff,#0066cc);color:#fff;}
.wal-btn-withdraw{background:linear-gradient(135deg,#2dc653,#007f5f);color:#fff;}
.wal-btn-history{background:rgba(255,255,255,0.06);color:#fff;border:1px solid rgba(255,255,255,0.08);}
.wallet-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:640px;margin:0 auto 18px;}
.wstat{background:#0d132b;border-radius:14px;padding:14px;text-align:center;border:1px solid rgba(255,255,255,0.04);}
.wstat-val{font-size:15px;font-weight:700;margin-bottom:3px;}
.wstat-lbl{font-size:10px;color:#444;text-transform:uppercase;letter-spacing:0.4px;}
.wstat.income .wstat-val{color:#2dc653;}
.wstat.expense .wstat-val{color:#e63946;}
.wstat.count .wstat-val{color:#4da3ff;}

/* Firebase status */
.fb-status{display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:18px;max-width:640px;margin-left:auto;margin-right:auto;}
.fb-dot{width:8px;height:8px;border-radius:50%;background:#e63946;animation:pulse 1.5s infinite;}
.fb-dot.connected{background:#2dc653;animation:none;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

.wallet-panel{max-width:640px;margin:0 auto 16px;background:#0d132b;border-radius:18px;border:1px solid rgba(255,255,255,0.05);overflow:hidden;}
.wallet-panel-header{display:flex;justify-content:space-between;align-items:center;padding:15px 19px;border-bottom:1px solid rgba(255,255,255,0.04);}
.wallet-panel-header h3{font-size:14px;font-weight:600;}
.panel-link{font-size:12px;color:#4da3ff;cursor:pointer;background:none;border:none;font-family:'Poppins',sans-serif;font-weight:500;}
.panel-link:hover{text-decoration:underline;}
.wallet-form{padding:18px;}
.form-group{margin-bottom:13px;}
.form-group label{display:block;font-size:11px;color:#555;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:5px;}
.form-group input,.form-group select{width:100%;background:#060d20;border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:10px 13px;color:white;font-size:13px;font-family:'Poppins',sans-serif;outline:none;transition:0.3s;}
.form-group input:focus,.form-group select:focus{border-color:#4da3ff;}
.form-group input::placeholder{color:#1e1e1e;}
.form-group select option{background:#0d132b;}
.quick-amounts{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
.quick-amt{padding:5px 11px;border:1px solid rgba(255,215,0,0.22);border-radius:20px;background:transparent;color:#ffd700;cursor:pointer;font-size:11px;font-weight:600;transition:0.3s;font-family:'Poppins',sans-serif;}
.quick-amt:hover{background:#ffd700;color:#000;}
.submit-btn{width:100%;padding:12px;border:none;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;transition:0.3s;margin-top:5px;font-family:'Poppins',sans-serif;}
.submit-btn.fund{background:linear-gradient(45deg,#ffd700,#ff9900);color:#000;}
.submit-btn.transfer{background:linear-gradient(45deg,#4da3ff,#0066cc);color:#fff;}
.submit-btn.withdraw{background:linear-gradient(45deg,#2dc653,#007f5f);color:#fff;}
.submit-btn:hover{transform:scale(1.02);}
.txn-list{padding-bottom:4px;}
.txn-item{display:flex;align-items:center;gap:10px;padding:12px 19px;border-bottom:1px solid rgba(255,255,255,0.03);}
.txn-item:hover{background:rgba(255,255,255,0.01);}
.txn-item:last-child{border-bottom:none;}
.txn-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.txn-icon.credit{background:rgba(45,198,83,0.12);color:#2dc653;}
.txn-icon.debit{back
